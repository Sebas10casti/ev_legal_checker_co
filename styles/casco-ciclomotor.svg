<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="100%" height="100%">
  <defs>
    <!-- Gradiente exterior de la calota / carcasa de fibra -->
    <linearGradient id="motoShell3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Franja deportiva roja reflectiva (estilo racing / visibilidad) -->
    <linearGradient id="racingStripe" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Visor ahumado con reflejos aerodinámicos de alta definición -->
    <linearGradient id="smokedVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Sombra suave volumétrica -->
    <filter id="helmet3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fondo de la tarjeta -->
  <rect width="100%" height="100%" rx="14" fill="#fff1f2" />
  <rect width="100%" height="100%" rx="14" fill="none" stroke="#fecdd3" stroke-width="1.5" />

  <g filter="url(#helmet3DShadow)" transform="translate(38, 14)">
    <!-- 1. Calota Exterior Principal (Silueta precisa de Casco Integral Deportivo) -->
    <!-- Curva que baja desde la coronilla, pasa por el spoiler posterior y define la nuca -->
    <path d="M 68 118
             C 45 116, 25 96, 22 72
             C 18 36, 60 14, 125 14
             C 188 14, 230 38, 236 82
             C 240 115, 230 138, 215 146
             C 198 155, 178 152, 160 152
             C 130 152, 105 146, 78 144
             C 65 143, 62 130, 68 118 Z"
          fill="url(#motoShell3D)" stroke="#090d16" stroke-width="2" />

    <!-- 2. Spoiler aerodinámico trasero (difusor de aire superior) -->
    <path d="M 180 32 C 205 38, 228 54, 236 78 C 228 72, 210 68, 195 66 Z" fill="#0f172a" />
    <path d="M 215 130 C 228 120, 234 105, 236 85 C 228 92, 220 108, 212 120 Z" fill="#020617" />

    <!-- 3. Franja deportiva de alta visibilidad roja / reflectiva -->
    <path d="M 42 75 
             C 70 38, 120 28, 175 30 
             C 192 31, 212 40, 225 54
             C 215 48, 190 42, 170 40
             C 120 38, 75 48, 48 82 Z"
          fill="url(#racingStripe)" />

    <!-- 4. Mentonera prominente frontal (característica distintiva de casco de moto) -->
    <!-- Proyección del mentón hacia adelante con ángulo agresivo de protección -->
    <path d="M 22 72
             C 20 86, 28 108, 52 118
             C 58 120, 68 124, 68 135
             C 68 144, 82 144, 98 144
             C 102 135, 96 116, 85 106
             C 58 106, 35 94, 22 72 Z"
          fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

    <!-- Tomas de aire activas en la mentonera (ventilación frontal antiempañante) -->
    <path d="M 36 94 L 48 94 L 46 98 L 34 98 Z" fill="#e11d48" />
    <path d="M 38 102 L 52 102 L 50 106 L 36 106 Z" fill="#334155" />
    <path d="M 40 110 L 56 110 L 54 114 L 38 114 Z" fill="#334155" />

    <!-- 5. Perfil de goma del puerto de visión (Eyeport gasket) -->
    <path d="M 28 66 
             C 45 38, 85 36, 142 36 
             C 165 36, 176 48, 172 82 
             C 168 108, 142 112, 85 112 
             C 48 112, 34 92, 28 66 Z" 
          fill="#020617" />

    <!-- 6. Visera curva de policarbonato abatible (Pantalla transparente/ahumada) -->
    <path d="M 30 64 
             C 48 40, 85 38, 140 38 
             C 158 38, 170 50, 166 80 
             C 162 104, 138 108, 85 108 
             C 52 108, 38 90, 30 64 Z" 
          fill="url(#smokedVisor)" stroke="#0f172a" stroke-width="1.2" />

    <!-- Reflejos realistas curvados en la visera (iluminación de estudio) -->
    <path d="M 42 62 C 60 46, 95 44, 132 44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 48 72 C 65 58, 98 56, 128 56" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <!-- Borde biselado inferior del visor con pestaña para levantar con el dedo -->
    <path d="M 80 108 L 92 108 L 90 112 L 82 112 Z" fill="#0f172a" />

    <!-- 7. Mecanismo de pivote y trinquete del visor (lateral) -->
    <circle cx="162" cy="74" r="11" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="162" cy="74" r="6" fill="#0f172a" />
    <circle cx="162" cy="74" r="2.5" fill="#94a3b8" />
    <path d="M 154 70 L 157 74 L 154 78" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- 8. Toma de aire superior regulable (en la coronilla) -->
    <path d="M 105 18 C 122 18, 140 22, 148 26 L 125 26 Z" fill="#e11d48" />

    <!-- 9. Acolchado inferior de cuello / protector de viento (Wind curtain) -->
    <path d="M 98 144 C 115 144, 138 148, 162 148 C 158 155, 140 157, 120 157 C 102 157, 98 152, 98 144 Z" fill="#020617" />

    <!-- 10. Etiqueta / Sello de Homologación ECE 22.06 Oficial posterior -->
    <rect x="194" y="118" width="30" height="17" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
    <text x="209" y="127" fill="#0f172a" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">
      ECE R
    </text>
    <text x="209" y="133" fill="#e11d48" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">
      22.06
    </text>
  </g>

  <!-- Píldora inferior compacta e independiente -->
  <rect x="24" y="190" width="292" height="26" rx="6" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1" />
  <text x="170" y="207" fill="#9f1239" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    ⚠️ Casco Integral / Abatible de Moto (Res. 23385)
  </text>
</svg>
