<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" width="100%" height="100%">
  <!-- Fondo de la tarjeta -->
  <rect width="100%" height="100%" rx="14" fill="#fff1f2" />
  <rect width="100%" height="100%" rx="14" fill="none" stroke="#fecdd3" stroke-width="1.5" />

  <!-- Casco de Moto estilo Flat Iconografía Moderna (Icons8) -->
  <g transform="translate(48, 12)">
    <!-- 1. Alerón / Spoiler aerodinámico posterior en gris oscuro -->
    <path d="M 45 42 
             C 45 42, 60 52, 62 62 
             C 62 72, 48 85, 45 88 
             L 55 88 
             C 68 78, 75 62, 70 48 Z" 
          fill="#334155" />

    <!-- 2. Base inferior acolchada / franja inferior ergonómica gris oscuro -->
    <path d="M 40 115 
             L 60 185 
             C 120 205, 195 240, 248 250 
             L 248 238 
             C 240 220, 235 200, 235 188 
             C 190 165, 120 140, 40 115 Z" 
          fill="#334155" />

    <!-- 3. Calota principal naranja brillante (Icons8 flat style) -->
    <path d="M 46 44 
             C 95 10, 185 10, 252 82 
             C 265 96, 260 135, 250 178 
             C 255 184, 275 190, 274 204 
             C 272 220, 260 225, 235 188 
             C 190 165, 120 140, 40 115 
             C 38 108, 48 95, 48 85 
             C 48 72, 38 52, 46 44 Z" 
          fill="#ea580c" />

    <!-- Mentonera frontal naranja curva que abraza la visera -->
    <path d="M 235 188 
             C 255 192, 274 198, 274 204 
             C 272 220, 250 248, 248 248 
             C 235 235, 230 205, 235 188 Z" 
          fill="#f97316" />

    <!-- 4. Visor de policarbonato translúcido ahumado / lavanda claro -->
    <path d="M 142 85 
             C 175 92, 235 105, 262 108 
             C 268 145, 270 175, 268 198 
             C 242 192, 192 165, 142 124 
             C 128 112, 128 92, 142 85 Z" 
          fill="#cbd5e1" opacity="0.9" />

    <!-- 5. Franjas oblicuas de reflejo blanco en el visor (brillo plano característico) -->
    <polygon points="172,92 194,96 172,148 150,144" fill="#ffffff" opacity="0.65" />
    <polygon points="208,98 230,102 212,175 190,170" fill="#ffffff" opacity="0.65" />
    <polygon points="244,105 258,107 248,190 234,186" fill="#ffffff" opacity="0.45" />

    <!-- 6. Mecanismo de pivote / bisagra circular lateral -->
    <circle cx="152" cy="115" r="22" fill="#334155" />
    <circle cx="152" cy="115" r="10" fill="#e2e8f0" />
  </g>

  <!-- Píldora inferior compacta e informativa -->
  <rect x="24" y="212" width="292" height="26" rx="6" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.2" />
  <text x="170" y="229" fill="#9f1239" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    ⚠️ Casco Integral / Abatible de Moto (Res. 23385)
  </text>
</svg>
