<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <!-- Gradiente de la carcasa de moto -->
    <linearGradient id="motoShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <!-- Visor de protección transparente policarbonato con reflejo -->
    <linearGradient id="visorReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.95" />
    </linearGradient>
    <filter id="softShadowRed" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#e11d48" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo limpio -->
  <rect width="100%" height="100%" rx="14" fill="#fff1f2" />
  <rect width="100%" height="100%" rx="14" fill="none" stroke="#fecdd3" stroke-width="1.5" />

  <g filter="url(#softShadowRed)" transform="translate(42, 10)">
    <!-- Silueta lateral realista de Casco Integral de Motocicleta -->
    <!-- Carcasa principal aerodinámica -->
    <path d="M 50 128
             C 42 120, 26 100, 28 65
             C 32 25, 75 14, 130 14
             C 185 14, 218 38, 222 80
             C 226 125, 205 158, 175 158
             C 142 158, 120 155, 95 155
             C 70 155, 52 145, 50 128 Z"
          fill="url(#motoShellGrad)" stroke="#881337" stroke-width="1.5" />

    <!-- Mentonera sólida frontal (protección total maxilar inferior) -->
    <path d="M 28 88 
             C 24 105, 30 128, 50 128 
             C 52 145, 70 155, 95 155 
             C 98 145, 95 125, 92 110 
             C 65 110, 42 98, 28 88 Z" 
          fill="#881337" />

    <!-- Acolchado inferior para cuello (cuello ergonómico) -->
    <path d="M 95 155 C 120 155, 142 158, 175 158 C 172 165, 150 168, 125 168 C 98 168, 92 162, 95 155 Z" fill="#0f172a" />

    <!-- Apertura ocular / Marco del visor -->
    <path d="M 32 78 C 45 42, 75 38, 138 38 C 158 38, 172 50, 168 85 C 165 112, 145 118, 92 118 C 55 118, 38 102, 32 78 Z" fill="#0f172a" />

    <!-- Visera curva de policarbonato abatible -->
    <path d="M 34 76 
             C 48 45, 78 40, 136 40 
             C 152 40, 165 52, 162 82 
             C 158 108, 140 114, 90 114 
             C 58 114, 42 98, 34 76 Z" 
          fill="url(#visorReflect)" stroke="#0f172a" stroke-width="1.5" />

    <!-- Reflejos de luz en el visor que dan sensación de curvatura 3D -->
    <path d="M 45 74 C 55 52, 78 48, 120 48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.65" />
    <path d="M 52 86 C 62 66, 85 60, 126 60" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- Mecanismo de pivote / bisagra del visor con resorte -->
    <circle cx="160" cy="80" r="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <circle cx="160" cy="80" r="5" fill="#475569" />
    <circle cx="160" cy="80" r="2" fill="#0f172a" />

    <!-- Rejilla de ventilación frontal mentonera -->
    <rect x="42" y="118" width="16" height="3" rx="1.5" fill="#0f172a" />
    <rect x="44" y="124" width="12" height="2.5" rx="1" fill="#0f172a" />

    <!-- Alerón / Spoilers aerodinámicos superiores -->
    <path d="M 125 15 C 145 15, 172 20, 185 28 C 175 32, 155 30, 135 28 Z" fill="#881337" />

    <!-- Sello de Certificación ECE 22.06 / DOT posterior -->
    <rect x="188" y="120" width="28" height="15" rx="3" fill="#0f172a" stroke="#ffffff" stroke-width="0.8" />
    <text x="202" y="131" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" text-anchor="middle">
      ECE
    </text>
  </g>

  <!-- Píldora inferior compacta e independiente -->
  <rect x="24" y="180" width="272" height="26" rx="6" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1" />
  <text x="160" y="197" fill="#9f1239" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    ⚠️ Casco de Motocicleta Integral / Abatible
  </text>
</svg>
