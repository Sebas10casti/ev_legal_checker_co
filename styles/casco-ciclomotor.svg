<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" width="100%" height="100%">
  <!-- Fondo de la tarjeta -->
  <rect width="100%" height="100%" rx="14" fill="#fff1f2" />
  <rect width="100%" height="100%" rx="14" fill="none" stroke="#fecdd3" stroke-width="1.5" />

  <!-- Casco de Motocicleta en Estilo Vectorial Iconográfico de Alto Impacto -->
  <g transform="translate(42, 10)">
    <!-- 1. Calota exterior principal blanca con trazo negro grueso -->
    <path d="M 68 142
             C 42 142, 24 120, 20 95
             C 16 52, 60 18, 126 18
             C 192 18, 238 52, 240 102
             C 242 140, 230 168, 206 178
             C 185 186, 162 184, 142 184
             C 112 184, 88 180, 52 178
             C 32 176, 25 158, 35 142 Z"
          fill="#ffffff" stroke="#0f172a" stroke-width="6.5" stroke-linejoin="round" />

    <!-- 2. Reborde inferior acolchado de la base / cuello -->
    <path d="M 38 152 C 55 184, 125 190, 206 180" 
          fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />

    <!-- 3. Mentonera frontal prominente con rejilla angular inferior -->
    <path d="M 36 142 L 52 172 L 80 172 L 72 142 Z" 
          fill="#ffffff" stroke="#0f172a" stroke-width="5" stroke-linejoin="round" />
    <polygon points="46,149 64,149 60,165 49,165" fill="#0f172a" />

    <!-- 4. Toma de aire superior en la coronilla (trapecio angular) -->
    <polygon points="98,24 145,24 135,36 108,36" 
             fill="#ffffff" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round" />
    <line x1="114" y1="26" x2="114" y2="34" stroke="#0f172a" stroke-width="3.5" />

    <!-- 5. Franja aerodinámica superior de la calota -->
    <path d="M 52 64 C 75 50, 110 50, 145 62 L 180 50 C 205 50, 225 60, 235 70" 
          fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
    <path d="M 72 54 L 115 54" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

    <!-- 6. Líneas aerodinámicas / difusor trasero estilo carreras (aleta de aire) -->
    <path d="M 172 122 L 230 102" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <path d="M 160 134 L 226 116" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <path d="M 148 146 L 222 130" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <path d="M 136 158 L 216 144" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

    <!-- 7. Visor / Pantalla de protección del casco -->
    <!-- Contorno exterior de la visera -->
    <path d="M 28 88 
             C 42 66, 80 62, 142 62 
             C 172 62, 192 74, 185 106 
             C 178 132, 148 138, 86 138 
             C 48 138, 34 116, 28 88 Z" 
          fill="#0f172a" stroke="#0f172a" stroke-width="5" stroke-linejoin="round" />

    <!-- Hueco interior del visor con reflejo blanco envolvente -->
    <path d="M 38 90 
             C 50 74, 82 72, 136 72 
             C 158 72, 170 82, 166 104 
             C 160 122, 136 128, 88 128 
             C 58 128, 44 112, 38 90 Z" 
          fill="#ffffff" />

    <!-- Interior oscuro con reflejo biselado superior de velocidad -->
    <path d="M 44 92 
             C 54 80, 84 78, 130 78 
             C 148 78, 158 86, 154 102 
             C 148 116, 128 122, 88 122 
             C 62 122, 50 110, 44 92 Z" 
          fill="#0f172a" />
    <path d="M 52 86 C 75 82, 108 82, 135 84" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- 8. Pestaña de apertura rápida en la base del visor -->
    <rect x="94" y="136" width="24" height="6" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="3" />

    <!-- 9. Mecanismo de bisagra / pivote circular lateral del visor -->
    <circle cx="178" cy="95" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="5" />
    <circle cx="178" cy="95" r="7" fill="#ffffff" stroke="#0f172a" stroke-width="4.5" />

    <!-- 10. Sello de certificación ECE 22.06 de tránsito -->
    <rect x="195" y="152" width="34" height="18" rx="3" fill="#e11d48" stroke="#0f172a" stroke-width="2" />
    <text x="212" y="164" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="middle">
      ECE 22.06
    </text>
  </g>

  <!-- Píldora inferior compacta -->
  <rect x="24" y="210" width="292" height="26" rx="6" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.2" />
  <text x="170" y="227" fill="#9f1239" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    ⚠️ Casco Integral / Abatible de Moto (Res. 23385)
  </text>
</svg>
