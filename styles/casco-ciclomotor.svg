<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="motoHelmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropGlowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#e11d48" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo de tarjeta -->
  <rect width="100%" height="100%" rx="16" fill="#fff1f2" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#fecdd3" stroke-width="2" />

  <!-- Insignia superior -->
  <g transform="translate(20, 24)">
    <rect width="210" height="26" rx="13" fill="#ffe4e6" />
    <text x="105" y="17" fill="#9f1239" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      OBLIGATORIO PARA CICLOMOTOR
    </text>
  </g>

  <!-- Ilustración del Casco de Moto Certificado -->
  <g filter="url(#dropGlowRed)" transform="translate(100, 48)">
    <!-- Carcasa Integral / Abatible de Moto -->
    <path d="M 35 125 C 20 85, 45 25, 100 25 C 160 25, 185 80, 175 135 C 170 160, 145 168, 120 168 C 80 168, 45 165, 35 125 Z" 
          fill="url(#motoHelmetGrad)" />

    <!-- Mentonera sólida frontal (protección mandíbula) -->
    <path d="M 35 125 C 38 145, 50 165, 95 165 C 105 165, 108 145, 108 135 L 55 125 Z" fill="#881337" />

    <!-- Visera de policarbonato con reflejo de protección -->
    <path d="M 45 75 C 65 65, 125 65, 150 78 C 158 98, 150 128, 115 130 C 70 130, 45 110, 45 75 Z" 
          fill="url(#visorGrad)" stroke="#0f172a" stroke-width="2.5" />
    <!-- Brillo del visor -->
    <path d="M 60 78 C 85 73, 120 75, 140 85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Sello de Certificación en la parte trasera -->
    <rect x="155" y="130" width="22" height="14" rx="2" fill="#0f172a" />
    <text x="166" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7" font-weight="extrabold" text-anchor="middle">
      ECE
    </text>

    <!-- Ventilación mentonera -->
    <line x1="65" y1="145" x2="85" y2="145" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="68" y1="151" x2="82" y2="151" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Especificaciones al pie -->
  <g transform="translate(20, 230)">
    <text x="0" y="0" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">
      Casco Reglamentario de Motocicleta
    </text>
    <text x="0" y="20" fill="#be123c" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
      Normas: ECE 22.05/06 · DOT FMVSS 218 · NTC 4533
    </text>
    <text x="0" y="38" fill="#475569" font-family="system-ui, sans-serif" font-size="11">
      Res. 23385/2020. Prohibido usar casco de bicicleta aquí (inmovilización).
    </text>
  </g>
</svg>
