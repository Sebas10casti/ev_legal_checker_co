<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <!-- Gradiente de la carcasa ciclista -->
    <linearGradient id="bikeShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="innerCavity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#059669" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Fondo limpio -->
  <rect width="100%" height="100%" rx="14" fill="#f0fdf4" />
  <rect width="100%" height="100%" rx="14" fill="none" stroke="#bbf7d0" stroke-width="1.5" />

  <g filter="url(#softShadow)" transform="translate(18, 12)">
    <!-- Correas en V bajo las orejas -->
    <path d="M 90 90 L 125 142" stroke="#334155" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 160 90 L 125 142" stroke="#334155" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Barboquejo bajo la barbilla -->
    <path d="M 125 142 L 155 142" stroke="#334155" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 190 90 L 155 142" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Hebilla de ajuste micrométrico / clip abrochado -->
    <rect x="133" y="137" width="14" height="10" rx="2.5" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <line x1="140" y1="138" x2="140" y2="146" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Carcasa externa del casco de ciclismo (silueta ergonómica lateral) -->
    <path d="M 40 92 
             C 32 75, 45 42, 90 28 
             C 140 12, 210 22, 245 68 
             C 255 82, 252 95, 235 96 
             C 215 97, 195 90, 160 92 
             C 120 94, 75 99, 40 92 Z" 
          fill="url(#bikeShellGrad)" />

    <!-- Borde interior inferior acolchado EPS negro -->
    <path d="M 42 92 C 75 97, 120 92, 160 90 C 195 88, 215 95, 235 94 C 238 96, 235 100, 228 101 C 190 102, 120 101, 40 95 Z" 
          fill="#1e293b" />

    <!-- Visera aerodinámica frontal -->
    <path d="M 40 92 C 26 94, 15 96, 12 98 C 22 102, 38 101, 46 96 Z" fill="#0f172a" />

    <!-- Tomas / ranuras de ventilación aerodinámicas con profundidad -->
    <path d="M 75 48 C 95 44, 120 42, 142 45 C 136 56, 110 60, 85 58 Z" fill="url(#innerCavity)" />
    <path d="M 68 67 C 90 64, 130 63, 165 66 C 158 78, 115 80, 78 78 Z" fill="url(#innerCavity)" />
    <path d="M 160 48 C 182 50, 205 60, 218 72 C 205 76, 185 71, 172 60 Z" fill="url(#innerCavity)" />

    <!-- Luz reflectiva / reflectante de seguridad posterior -->
    <rect x="230" y="80" width="12" height="7" rx="2" fill="#ef4444" stroke="#b91c1c" stroke-width="1" />

    <!-- Sello de norma NTC / EN -->
    <rect x="180" y="85" width="28" height="9" rx="2" fill="#064e3b" />
    <text x="194" y="92" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">
      EN 1078
    </text>
  </g>

  <!-- Píldora inferior compacta e independiente -->
  <rect x="24" y="180" width="272" height="26" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="160" y="197" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    ✓ Casco de Ciclismo / Patineta (Abrochado)
  </text>
</svg>
