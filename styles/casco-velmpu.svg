<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bicycleHelmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="innerShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo de tarjeta -->
  <rect width="100%" height="100%" rx="16" fill="#f0fdf4" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#86efac" stroke-width="2" />

  <!-- Insignia superior -->
  <g transform="translate(20, 24)">
    <rect width="170" height="26" rx="13" fill="#dcfce7" />
    <text x="85" y="17" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      ✓ VÁLIDO PARA VELMPU
    </text>
  </g>

  <!-- Ilustración del Casco de Ciclismo / Patineta -->
  <g filter="url(#dropGlow)" transform="translate(100, 50)">
    <!-- Correas de sujeción (Barboquejo) -->
    <path d="M 65 110 L 85 175 L 115 175 L 135 110" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
    <!-- Hebilla abrochada -->
    <rect x="90" y="168" width="20" height="12" rx="3" fill="#0f172a" />
    <rect x="95" y="171" width="10" height="6" rx="1" fill="#94a3b8" />

    <!-- Carcasa principal aerodinámica -->
    <path d="M 30 115 C 20 80, 50 35, 100 30 C 150 25, 185 65, 175 115 C 160 120, 140 122, 100 122 C 60 122, 45 120, 30 115 Z" 
          fill="url(#bicycleHelmetGrad)" />

    <!-- Visera frontal -->
    <path d="M 28 112 C 15 115, 8 118, 5 120 C 18 126, 35 124, 45 120 Z" fill="#0f172a" />

    <!-- Ranuras de ventilación características -->
    <path d="M 60 55 C 75 52, 95 50, 110 52 C 105 65, 85 68, 65 65 Z" fill="url(#innerShade)" />
    <path d="M 50 78 C 70 75, 100 73, 130 75 C 122 90, 80 92, 55 90 Z" fill="url(#innerShade)" />
    <path d="M 125 55 C 145 58, 155 68, 160 80 C 150 82, 138 78, 132 68 Z" fill="url(#innerShade)" />

    <!-- Detalle de luz reflectiva trasera -->
    <rect x="155" y="102" width="16" height="8" rx="2" fill="#ef4444" />
  </g>

  <!-- Especificaciones al pie -->
  <g transform="translate(20, 230)">
    <text x="0" y="0" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">
      Casco de Movilidad Personal / Ciclismo
    </text>
    <text x="0" y="20" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
      Normas: NTC 5239 · EN 1078 · CPSC 1203
    </text>
    <text x="0" y="38" fill="#475569" font-family="system-ui, sans-serif" font-size="11">
      Obligatorio barboquejo cerrado. Evita inmovilización en Ley 2486.
    </text>
  </g>
</svg>
